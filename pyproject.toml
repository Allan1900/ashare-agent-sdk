[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "stockpulse"
version = "0.1.0"
description = "让 AI Agent 做 A 股分析 —— 不只是查数据。北向资金/龙虎榜/宏观/行情/财务，OpenAI 兼容 API + MCP 协议 + CLI。"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "ALLAN", email = "hermes@nousresearch.com"},
]

dependencies = [
    "click>=8.0",
    "pandas>=2.0",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "fastapi>=0.100",
    "uvicorn>=0.23",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
stockpulse = "stockpulse.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]